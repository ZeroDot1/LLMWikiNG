services:
  llmwiking:
    build: .
    container_name: llmwiking_app
    hostname: llmwiking
    ports:
      - "8082:8080" # Mappt Port 8082 des Hosts auf Port 8080 des Containers
    restart: unless-stopped
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - APP_PORT=8080
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/tailscale/serve.json
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-llmwiking}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      - ${DOCKER_VOLUME_BASE:-/volume1/docker/llmwiking}/data:/app/data
      - ${DOCKER_VOLUME_BASE:-/volume1/docker/llmwiking}/wikis:/app/wikis
      - ${DOCKER_VOLUME_BASE:-/volume1/docker/llmwiking}/raw:/app/raw
      - ${DOCKER_VOLUME_BASE:-/volume1/docker/llmwiking}/output_docs:/app/output_docs
      - ${DOCKER_VOLUME_BASE:-/volume1/docker/llmwiking}/config.json:/app/config.json
      - ${DOCKER_VOLUME_BASE:-/volume1/docker/llmwiking}/ts-data:/var/lib/tailscale
      - ${DOCKER_VOLUME_BASE:-/volume1/docker/llmwiking}/ts-config:/config/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun


